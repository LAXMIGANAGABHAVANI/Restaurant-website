<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foodie's Restaurant</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>  

  <header>
    <nav>
      <h1>Foodie's</h1>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h2>Delicious Food For Everyone</h2>
    <p>Fresh ingredients and tasty dishes</p>
    <button>Order Now</button>
  </section>

  <section class="menu">
    <h2>Our Special Menu</h2>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" alt="">
        <h3>Pizza</h3>
        <p>Cheesy and delicious pizza.</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=500" alt="">
        <h3>Burger</h3>
        <p>Juicy burgers with fresh veggies.</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500" alt="">
        <h3>Pasta</h3>
        <p>Italian pasta with creamy sauce.</p>
      </div>

    </div>
  </section>

  <section class="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2026 Foodie's Restaurant</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
